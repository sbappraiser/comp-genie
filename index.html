<div id="app"><p id="bootMsg" style="font:700 20px system-ui,sans-serif;padding:32px">Starting Comp Genie…</p></div>
<script>window.onerror=function(m,s,l){var b=document.getElementById('bootMsg');if(b){b.style.color='#c00';b.textContent='Comp Genie could not start: '+m+' (line '+l+'). Send a screenshot to Claude.';}};</script>
<script>
const BUILD='g2-1019-0329';
/* ---------------- small helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const blank = v => v === undefined || v === null || v === '' || (typeof v === 'number' && isNaN(v)) || (Array.isArray(v) && !v.length);
const num = v => { if (blank(v)) return null; const n = Number(String(v).replace(/[$,\s]/g, '')); return isNaN(n) ? null : n; };
const money = v => blank(v) ? '' : '$' + Math.round(+v).toLocaleString();
const int = v => blank(v) ? '' : Math.round(+v).toLocaleString();
const titleCase = s => String(s || '').toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase()).replace(/\b(Ii|Iii|Iv)\b/g, m => m.toUpperCase());
function toast(msg, ms = 2800) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

/* ---------------- dates: everything is kept as YYYY-MM-DD ---------------- */
function isoDate(v) {
  if (blank(v)) return '';
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) { let y = +m[3]; if (y < 100) y += y > 50 ? 1900 : 2000; return `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; }
  if ((m = s.match(/^(\d{4})-(\d{1,2})$/))) return `${m[1]}-${m[2].padStart(2, '0')}`; // month only (archive)
  return '';
}
const showDate = v => { const d = isoDate(v); if (!d) return ''; const [y, m, dd] = d.split('-'); return dd ? `${m}/${dd}/${y}` : `${m}/${y}`; };
const monthsBetween = (a, b) => { const A = new Date(isoDate(a).length === 7 ? a + '-15' : a), B = new Date(isoDate(b).length === 7 ? b + '-15' : b); return (B - A) / (30.44 * 864e5); };

/* ---------------- addresses ----------------
   One key per property that survives the ways the sources write an address:
   "1848 E Valley Rd" (archive), "1848 Valley" (MLS export), "1848 E VALLEY RD" (CORT / CRS).
   Key = street number + the street name without direction and suffix (+ unit). */

const SALE_TYPE_TEXT = { ArmLth: "Arm's length", Listing: 'Listing', REO: 'REO (bank owned)', Short: 'Short sale', Estate: 'Estate sale', CrtOrd: 'Court ordered (probate)', NonArm: "Non-arm's length", Relo: 'Relocation', Trust: 'Trust sale' };
function fmt(f, v) {

  switch (f.t) {
    case 'money': return money(v);
    case 'int': return int(v);
    case 'year': return String(Math.round(+v));
    case 'num': return String(+(+v).toFixed(2));
    case 'num6': return (+v).toFixed(6);
    case 'date': return showDate(v);

}

  if (f.t === 'date') return isoDate(s) || s;
  if (f.t === 'site') { const m = s.match(/^([\d.,]+)\s*(ac|acre|acres)?$/i); if (!m) return num(s); const n = num(m[1]); return m[2] || n < 200 ? Math.round(n * 43560) : n; }

}
const normCmp = (f, v) => {

  if (f.k === 'apn') return apnKey(v);
  if (['money', 'int', 'num', 'year', 'site', 'num6'].includes(f.t)) return +v;

  if (typeof x === 'number') { if (f.t === 'num6') return Math.abs(x - y) < 0.002; if (f.t === 'site') return Math.abs(x - y) <= Math.max(500, 0.03 * Math.max(x, y)); return Math.abs(x - y) <= Math.max(f.t === 'money' ? 1 : 0, 0.005 * Math.max(Math.abs(x), Math.abs(y))); }

/* ---------------- one comp ---------------- */
function newComp(seed) {
  return { id: uid(), created: Date.now(), key: seed.key || '', apn: seed.apn || '', mls: seed.mls || '', label: seed.label || '',
    src: { arch: [], mls: null, pdf: null, crs: null, cort: [] }, archPick: null, cortPick: 0, pick: {}, edit: {}, use: null, photos: [], front: null, notes: '' };
}
const compKeyOf = c => c.key || addrKey(val(c, 'addr').v || c.label);

/* the sale this comp is about: MLS (closed or pending) → CORT → CRS → your archive */
function currentSale(c) {
  const m = c.src.mls, p = c.src.pdf;
  for (const s of [m, p]) if (s && (s.saleDate || s.contractDate || /Pending|Active/i.test(s.status || ''))) return { date: s.saleDate || s.contractDate || s.listDate || '', price: s.salePrice || null, from: s._src, status: s.status };
  const t = c.src.cort[c.cortPick || 0]; if (t && t.saleDate) return { date: t.saleDate, price: t.salePrice, from: 'cort', status: 'Closed' };
  const r = c.src.crs && c.src.crs.lastSale; if (r && r.date && monthsBetween(r.date, todayISO()) < 24) return { date: r.date, price: r.price, from: 'crs', status: 'Closed' };
  const a = c.src.arch.find(x => x.v.salePrice); if (a) return { date: a.v.saleDate, price: a.v.salePrice, from: 'arch', status: 'Closed' };
  return null;
}
function archMatches(a, sale) { // is this archive record the same sale?
  if (!sale) return true; if (sale.from === 'arch') return !!a.v.salePrice;
  if (!a.v.salePrice || !a.v.saleDate) return false;
  if (sale.price && Math.abs(a.v.salePrice - sale.price) <= 1000) return true;
  return sale.date ? Math.abs(monthsBetween(a.v.saleDate, sale.date)) <= 1.5 : false;
}
function archChosen(c) {
  if (!c.src.arch.length) return null;
  if (c.archPick !== null && c.archPick !== undefined) { const a = c.src.arch.find(x => x.rec === c.archPick); if (a) return a; }
  const sale = currentSale(c);
  return c.src.arch.find(a => archMatches(a, sale)) || c.src.arch[0];
}
function srcVals(c) { // canonical values per source for this comp
  const a = archChosen(c);
  // show the CRS recorded price beside the others when its last sale is this sale
  let crs = c.src.crs; const sale = currentSale(c);
  if (crs && crs.lastSale && sale && sale.date && Math.abs(monthsBetween(crs.lastSale.date, sale.date)) <= 2) crs = { ...crs, salePrice: crs.lastSale.price, saleDate: crs.lastSale.date };
  return { arch: a ? a.v : null, mls: c.src.mls, pdf: c.src.pdf, crs, cort: c.src.cort[c.cortPick || 0] || null };
}
function defaultOrder(c, f) {
  const a = archChosen(c), sale = currentSale(c); const matched = a && archMatches(a, sale);
  const recent = a && (matched || (a.v.saleDate && sale && sale.date && Math.abs(monthsBetween(a.v.saleDate, sale.date)) <= 24) || (!a.v.saleDate && a.entered && monthsBetween(a.entered, todayISO()) <= 24));

    case 'sale': return matched ? ['arch', 'mls', 'pdf', 'cort', 'crs'] : ['mls', 'pdf', 'cort'];
    case 'listing': return ['pdf', 'mls', ...(matched ? ['arch'] : []), ...(sale && sale.from === 'arch' ? ['arch'] : [])];

}
function val(c, k) { // → { v, src, auto }
  const f = FIELD[k] || { k, t: 'text', kind: 'id' };
  if (c.edit && k in c.edit && !blank(c.edit[k])) return { v: c.edit[k], src: 'edit' };
  const S = srcVals(c);
  if (c.pick && c.pick[k] && S[c.pick[k]] && !blank(S[c.pick[k]][k])) return { v: S[c.pick[k]][k], src: c.pick[k] };
  for (const s of defaultOrder(c, f)) if (S[s] && !blank(S[s][k])) {
    let v = S[s][k];
    // your archive keeps sale dates as month/year: take the exact day from another source when it is the same month
    if (f.t === 'date' && String(v).length === 7) { const exact = SRC_ORDER.map(x => S[x] && S[x][k]).find(x => x && String(x).length === 10 && String(x).startsWith(v)); if (exact) v = exact; }

}
const V = (c, k) => val(c, k).v;
function disagree(c, k) {
  const f = FIELD[k]; const S = srcVals(c); const vals = SRC_ORDER.map(s => S[s] && S[s][k]).filter(v => !blank(v));
  for (let i = 1; i < vals.length; i++) if (!sameVal(f, vals[0], vals[i])) return true; return false;
}
function compTitle(c) { const a = V(c, 'addr') || c.label || '(no address)'; const u = V(c, 'unit'); return a + (u ? ' #' + u : ''); }

/* ---------------- sale and listing history ---------------- */
function priorSales(c) {
  const out = []; const sale = currentSale(c);
  const add = s => { if (!s || !s.date) return; out.push(s); };
  (c.src.pdf ? c.src.pdf.priorSales : []).forEach(add);
  (c.src.crs ? c.src.crs.priorSales : []).forEach(add);
  c.src.cort.forEach(t => add({ date: t.saleDate, price: t.salePrice, src: 'CORT ' + (t.period || ''), type: t.salePrice ? 'Sale' : 'Transfer' }));
  c.src.arch.forEach(a => {
    // "02/25/2026 | 0 | CRS - Intrafamily" = a $0 deed transfer; "10/07/2024 | 0 | CRS - No Transfers" = the date you searched, not a sale
    const txt = String(a.v.priorSaleText || ''); const m = txt.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})\s*\|\s*\$?([\d,]+)\s*\|?\s*(.*)$/);
    if (m && !/no transfer/i.test(txt)) { const pr = num(m[2]); const inst = m[3].replace(/^(CRS Data|CRS|Realist|Realquest|NDC)\s*-\s*/i, '').trim(); add({ date: isoDate(m[1]), price: pr || null, inst, src: 'Your archive (' + (a.report || '') + ')', type: pr ? 'Sale' : 'Transfer' }); } if (a.v.salePrice && !archMatches(a, sale)) add({ date: a.v.saleDate, price: a.v.salePrice, src: 'Your archive (' + (a.report || '') + ')', type: 'Sale' }); });
  // drop this sale itself and repeats of the same transfer from several sources
  // the same transfer seen from another source (your figure can differ a little from the recorded price)
  const isThis = s => sale && sale.date && Math.abs(monthsBetween(s.date, sale.date)) <= 2 && (!s.price || !sale.price || Math.abs(s.price - sale.price) <= sale.price * 0.05);
  const kept = [];
  out.filter(s => !isThis(s)).sort((a, b) => b.date.localeCompare(a.date)).forEach(s => {
    const dup = kept.find(k => Math.abs(monthsBetween(k.date, s.date)) <= 2 && (!k.price || !s.price || Math.abs(k.price - s.price) <= Math.max(1000, k.price * 0.002)));
    if (dup) { if (!dup.src.includes(s.src)) dup.src += '; ' + s.src; if (!dup.price && s.price) dup.price = s.price; } else kept.push({ ...s });

  return kept.filter(s => !sale || !sale.date || s.monthsBefore > 0 || s.date <= sale.date);
}
function compFlags(c, job) {
  const F = []; const sale = currentSale(c); const yb = V(c, 'yearBuilt'); const price = V(c, 'salePrice');
  const st = V(c, 'status') || (sale && sale.status) || '';
  if (/Active/i.test(st)) F.push({ sev: 'info', t: 'Active listing (not a sale)' });
  else if (/Pending|Under Contract|Contingent/i.test(st)) F.push({ sev: 'info', t: 'Pending sale – contract price may be unknown' });
  else if (/Expired|Withdrawn|Cancel/i.test(st)) F.push({ sev: 'warn', t: st + ' listing (did not sell)' });
  const st2 = V(c, 'saleType'); if (st2 && !/ArmLth|Listing/i.test(st2)) F.push({ sev: 'warn', t: 'Sale type: ' + (SALE_TYPE_TEXT[st2] || st2) + (c.src.mls && c.src.mls.saleTypeNote ? ' (' + c.src.mls.saleTypeNote + ')' : '') });
  const PS = priorSales(c); const before = yb ? PS.filter(s => s.price && s.date && +s.date.slice(0, 4) < +yb) : [];
  if (before.length) F.push({ sev: 'info', t: `Sold before the house was built (${yb}): ${before.slice(0, 3).map(s => showDate(s.date) + ' ' + money(s.price)).join(', ')}${before.length > 3 ? ' …' : ''} – land or teardown ${before.length > 1 ? 'sales, not resales' : 'sale, not a resale'}` });
  PS.forEach(s => {
    if (before.includes(s) || (yb && s.date && +s.date.slice(0, 4) < +yb)) return;
    if (!s.price) { if (s.monthsBefore > 0 && s.monthsBefore <= 12) F.push({ sev: 'info', t: `Transfer within 12 months: ${showDate(s.date)} ${s.inst || 'deed'} (no price)` }); return; }
    if (price && s.price && s.monthsBefore > 0 && s.monthsBefore <= 24 && price >= s.price * 1.25) F.push({ sev: 'warn', t: `Quick resale: sold ${showDate(s.date)} for ${money(s.price)}, ${Math.round(s.monthsBefore)} months earlier (+${Math.round((price / s.price - 1) * 100)}%) – check for a flip or remodel` });
    else if (s.monthsBefore > 0 && s.monthsBefore <= 12) F.push({ sev: 'info', t: `Prior sale within 12 months: ${showDate(s.date)} ${money(s.price)} – report it in the prior sale history` });
  });
  const p = c.src.pdf;
  if (p) {
    if (p.fallthroughs) F.push({ sev: 'info', t: `Escrow fell through ${p.fallthroughs} time${p.fallthroughs > 1 ? 's' : ''} before this sale` });
    const dupes = (p.listings || []).filter(h => h.mls !== p.mls && /Closed/i.test(h.status) && sale && h.date && Math.abs(monthsBetween(h.date, sale.date)) < 1);

  const used = val(c, 'salePrice'); const Sv = srcVals(c);

    F.push({ sev: 'warn', t: `Recorded price (${SRC[s].short}) ${money(rp)} differs from the price used, ${money(used.v)} (${SRC[used.src].short}) – explain in the report which is the effective sale price and why (credit, personal property, recording error)` }); });

  const op = V(c, 'origList'); if (op && price && price < op * 0.85) F.push({ sev: 'info', t: `Sold ${Math.round((1 - price / op) * 100)}% under the original list price` });
  c.src.cort.forEach(t => { if (t.conf !== null && t.conf < 60) F.push({ sev: 'warn', t: `CORT line read with low confidence (${t.conf}) – check it against the scan ${t.file || ''}` }); });
  if (disagree(c, 'gla')) F.push({ sev: 'info', t: 'Square footage differs between sources' });
  const a = archChosen(c); if (a && sale && !archMatches(a, sale) && a.v.saleDate) F.push({ sev: 'info', t: `Your archive has this property from an earlier sale (${showDate(a.v.saleDate)}); its sale facts are not used. House facts from your record ${monthsBetween(a.v.saleDate, sale.date) <= 24 ? 'are used' : 'are older than 2 years, so MLS is used first'}` });

  return F;
}
function proximity(c, job) {
  const s = job && job.subject; if (!s) return null;
  const a = { lat: num(s.lat), lon: num(s.lon) }, b = { lat: num(V(c, 'lat')), lon: num(V(c, 'lon')) };
  const mi = milesBetween(a, b); if (mi === null) return null;

}

/* =====================================================================
   Grid workbook (Oct 2026) – office, three monitors.
   · Workbook view: only the lines she compares / adjusts, comp facts typed
     straight into the grid, comps a page at a time (subject always shown).
   · Pop-outs: the grid in separate windows (comps 1–3, 4–6, 7–9 …) she moves
     to each monitor; every window stays in step (BroadcastChannel + the same
     browser storage).
   · Keys: Tab = same line, next comp (then the next line); Shift+Tab back;
     Enter = same comp, next line.  "=" copies the subject's entry for that
     line, "=2" copies comp 2's.  Ctrl+Shift+2 swaps this comp with comp 2.

   assignment (from the order in the Appraisal Assistant), legal description, zoning,

   hub's Market tab), contract (from the hub's document reader), value and dates.
   She decides every answer; the card only pre-fills what the order already says.
   ===================================================================== */
const ASSIGN = [['Purchase', 'Purchase'], ['Refinance', 'Refinance'], ['HomeEquity', 'Home equity'], ['Construction', 'Construction'], ['LoanModification', 'Loan modification'], ['REO', 'REO'], ['ShortSale', 'Short sale'], ['DeedInLieu', 'Deed in lieu'], ['Preforeclosure', 'Pre-foreclosure'], ['PortfolioEvaluation', 'Portfolio evaluation'], ['Other', 'Other']];
const VMETHOD = [['TraditionalAppraisal', 'Traditional appraisal'], ['HybridAppraisal', 'Hybrid appraisal'], ['DesktopAppraisal', 'Desktop appraisal']];
const VCOND = [['AsIs', 'As is'], ['SubjectToRepair', 'Subject to repair'], ['SubjectToInspection', 'Subject to inspection'], ['SubjectToCompletionPerPlans', 'Subject to completion per plans']];
const HBU_TESTS = [['legal', 'Legally permissible'], ['phys', 'Physically possible'], ['fin', 'Financially feasible'], ['max', 'Maximally productive']];
const ORDER_ASSIGN = { uadPurchase: 'Purchase', uadRefi: 'Refinance', uadHeloc: 'HomeEquity', uadConstruction: 'Construction', construction: 'Construction' };

const R0 = J => { J.report = J.report || { hbu: {} }; J.report.hbu = J.report.hbu || {}; return J.report; };
const orderOf = J => (app.orders || []).find(o => o.id === J.orderId) || null;
function zoneTable() { if (!app.zoneDesc) { app.zoneDesc = {}; DB.get('kv', 'zoneDesc').then(r => { app.zoneDesc = (r && r.v) || {}; const c = $('#reportCard'); if (c && app.job) c.innerHTML = reportHTML(app.job); }); } return app.zoneDesc; }

/* what the order, the inspection and the CRS already say (shown grey until she types her own) */
function reportFrom(J) {
  const o = orderOf(J) || {}, I = (J.subject.insp || {}), crs = J.subject.crs || {}, oc = o.crs || {};
  const zone = I.zoneCode || (o.permits && o.permits.zoning) || oc.zoning || crs.zoning || '';
  const apns = String(o.apn || J.subject.apn || I.apn || '').split(/[;,&]| and /).map(x => x.trim()).filter(Boolean);
  const c0 = (o.clients || [])[0] || {};
  return { assign: ORDER_ASSIGN[o.type] || (o.type ? 'Other' : ''), fileNo: o.fileNo || J.fileNo || '', eff: o.effDate || o.inspDate || o.dod || J.subject.eff || '',
    legal: o.legal || I.legal || crs.legal || '', rightsNot: o.rightsNot || '', zone, zoneDesc: I.zoneDesc || zoneTable()[zone.toUpperCase()] || '', parcels: apns.length || (I.apn ? 1 : ''),
    client: c0.company || c0.name || '', clientAddr1: c0.addr1 || '', clientAddr2: c0.addr2 || '',
    lender: o.lenderDiff ? (o.lenderCo || '') : '', lenderAddr1: o.lenderDiff ? o.lenderAddr1 || '' : '', lenderAddr2: o.lenderDiff ? o.lenderAddr2 || '' : '',
    amc: o.amcUsed ? (o.amcCo || '') : '', amcAddr1: o.amcUsed ? o.amcAddr1 || '' : '', amcAddr2: o.amcUsed ? o.amcAddr2 || '' : '',
    insp: I.inspType || 'InteriorAndExterior', market: (o.market && o.market.uad) || null, contract: o.uad || null, hasOrder: !!o.id };
}
const rv = (J, k) => { const R = R0(J), F = reportFrom(J); return blank(R[k]) ? F[k] : R[k]; };

function reportHTML(J) {
  const R = R0(J), F = reportFrom(J), G = G0(J), H = R.hbu;
  const inp = (k, ph, w) => `<input class="txt" data-rpt="${k}" value="${esc(R[k] ?? '')}" placeholder="${esc(F[k] || ph || '')}"${w ? ` style="width:${w}"` : ''}>`;
  const sel = (k, list, def, note = 'from the order') => `<select data-rpt="${k}"><option value="">${def ? esc((list.find(x => x[0] === def) || [, ''])[1]) + ' (' + note + ')' : '—'}</option>${list.map(([v, l]) => `<option value="${v}"${R[k] === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const yn = (k, def) => `<select data-rpt="${k}"><option value="">${def === true ? 'Yes' : def === false ? 'No' : '—'}${def !== undefined ? ' (usual)' : ''}</option><option value="true"${R[k] === 'true' ? ' selected' : ''}>Yes</option><option value="false"${R[k] === 'false' ? ' selected' : ''}>No</option></select>`;
  const M = F.market;
  return `<h2>Report details <small>for the full report</small></h2>
  <p class="help">${F.hasOrder ? 'Grey entries come from the order in the Appraisal Assistant, your inspection or the CRS report. Type over any of them.' : 'This assignment is not linked to an order, so nothing is filled from the Appraisal Assistant. Open it from the order (Comp genie button on the order page) to fill the assignment, client and market.'}</p>
  <div class="rptgrid">
    <section><h3>Assignment</h3>
      <label class="fld"><span>Assignment reason</span>${sel('assign', ASSIGN, F.assign)}</label>
      ${rv(J, 'assign') === 'Other' ? `<label class="fld"><span>Other reason</span>${inp('assignOther', 'e.g. Estate settlement')}</label>` : ''}
      <label class="fld"><span>Property valuation method</span>${sel('vmethod', VMETHOD, 'TraditionalAppraisal', 'usual')}</label>
      <label class="fld"><span>Property data report used instead of an inspection?</span>${yn('pdr', false)}</label>
      <label class="fld"><span>Your file number</span>${inp('fileNo')}</label>
      <label class="fld"><span>Effective date</span>${inp('eff', 'YYYY-MM-DD')}</label>
      <label class="fld"><span>Client</span>${inp('client', 'Client name')}</label>
      <label class="fld"><span>Client address</span>${inp('clientAddr1', 'Street')} ${inp('clientAddr2', 'City, ST ZIP')}</label>
      <label class="fld"><span>Lender (if not the client)</span>${inp('lender')}</label>
      <label class="fld"><span>AMC</span>${inp('amc')}</label></section>
    <section><h3>Subject and site</h3>
      <label class="fld"><span>Legal description</span><textarea class="txt" rows="2" data-rpt="legal" placeholder="${esc(F.legal || 'From the CRS report or the preliminary title report')}">${esc(R.legal || '')}</textarea></label>
      <label class="fld"><span>Number of parcels</span>${inp('parcels', '1', '5em')}</label>
      <label class="fld"><span>All rights included in the appraisal?</span>${yn('allRights', true)}</label>
      <label class="fld"><span>Rights not included <small class="muted">(only sent when the answer above is No; 540 characters)</small></span><textarea class="txt" rows="2" maxlength="540" data-rpt="rightsNot" placeholder="${esc(F.rightsNot || 'e.g. Oil, gas and mineral rights below 500 feet, reserved in a prior deed')}">${esc(R.rightsNot || '')}</textarea>${F.rightsNot && R.allRights !== 'false' ? '<small class="muted">The order has a reservation from the deed. If those rights are not part of what you appraised, answer No above.</small>' : ''}</label>

async function readOrders() { // read-only; never creates the orders storage if the assistant was not used in this browser

/* ---------------- files in ---------------- */
async function ingest(files) {
  const notes = []; app.batch = []; app.crsChoices = [];
  for (const f of files) {
    try {
      app.busy = 'Reading ' + f.name + '…'; renderBusy();
      const low = f.name.toLowerCase();
      if (low.endsWith('.zip')) { const z = await readZip(f); notes.push(z.has('inspection-backup.json') ? await ingestInspection(z, f.name) : await ingestPhotos(f, z)); }
      else if (low.endsWith('.csv')) {
        const text = await readText(f); const head = text.slice(0, 2000).toLowerCase();
        if (head.includes('listing number')) notes.push(ingestMls(parseMlsCsv(text), f.name));
        else if (head.includes('grantor')) notes.push(await ingestCort(parseCortCsv(text), f.name));
        else notes.push(f.name + ': not an MLS export or a CORT table');
      } else if (low.endsWith('.gz') || low.endsWith('.json')) notes.push(await ingestJson(f));
      else if (low.endsWith('.pdf')) {
        const first = await pdfFirstText(f);
        if (/APN\/Tax ID|CRS Data|Property Report/i.test(first.text)) { const c = crsCanon(parseCRS(await pdfLines(f))); notes.push(ingestCrs(c, f.name)); }
        else if (/flexmls|MLS #/i.test(first.text)) { const L = await pdfLines(f, (n, t) => { if (n % 20 === 0) { app.busy = `Reading the MLS printout… page ${n} of ${t}`; renderBusy(); } }); notes.push(ingestPdf(parseMlsPdf(L), f.name)); }
        else if (!first.text.trim()) notes.push(f.name + ': this is a scan (a picture, no text). If it is a CORT printout, send it to Claude for now to add it to your CORT table.');
        else notes.push(f.name + ': not a PDF the genie knows (MLS printout or CRS report).');
      } else notes.push(f.name + ': file type not used here');
    } catch (e) { console.error(e); notes.push(f.name + ': could not read – ' + (e.message || e)); }
  }
  app.busy = ''; save(); render(); if (notes.length) showNotes(notes, app.batch.slice(), app.crsChoices.slice());
}
function logFile(name, kind, n, id) {
  app.job.files = (app.job.files || []).filter(x => !(x.name === name && x.kind === kind));
  const e = { id: id || uid(), name, kind, n, at: Date.now() }; app.job.files.push(e); if (app.batch) app.batch.push(e.id); return e;
}
/* Take a dropped file back out: its data comes off every comp, and comps that came only from it are removed. */
const KIND_SRC = { 'MLS export': 'mls', 'MLS printout': 'pdf', 'CRS report': 'crs' };
async function removeFile(fileId) {
  const J = app.job; const e = (J.files || []).find(x => x.id === fileId); if (!e) return;
  const mine = rec => rec && (rec._file === e.id || (!rec._file && e.legacy));
  const src = KIND_SRC[e.kind];
  if (src) J.comps.forEach(c => { if (mine(c.src[src])) { c.src[src] = null; c._lost = true; } });
  if (e.kind === 'CRS (subject)' && J.subject.crs) { const r = J.subject.crs; if (String(J.subject.lat) === String(r.lat)) { J.subject.lat = ''; J.subject.lon = ''; } J.subject.crs = null; }
  if (e.kind === 'MLS photos') { for (const p of await DB.byJob(J.id)) if (p.file === e.id || (!p.file && e.legacy)) await DB.del('photos', p.id); app.photoCache.clear(); await loadPhotos(); }
  if (e.kind === 'CORT table') { const before = app.cort.length; app.cort = app.cort.filter(r => r._file !== e.id); if (app.cort.length !== before) { setCort(app.cort); await DB.put('kv', { id: 'cort', rows: app.cort }); J.comps.forEach(attachCort); } }
  const left = c => c.src.mls || c.src.pdf || c.src.crs || c.use || Object.keys(c.edit || {}).length;
  J.comps = J.comps.filter(c => { const gone = (c.madeBy === e.id || (c._lost && !c.madeBy)) && !left(c); delete c._lost; return !gone; });
  if (app.sel && !J.comps.some(c => c.id === app.sel)) app.sel = null;
  J.files = J.files.filter(x => x.id !== e.id); await saveNow();
}
function ingestMls(rows, name) {
  let made = 0, merged = 0; const fid = uid();
  rows.forEach(r => { const { isNew } = upsertComp({ mls: r.mls, apn: r.apn, key: r.addr ? addrKey(r.addr) : '', label: r.addr }, 'mls', r, fid); isNew ? made++ : merged++; });
  logFile(name, 'MLS export', rows.length, fid);
  return `${name}: ${rows.length} listings (${made} new, ${merged} matched to comps already here)`;
}
function ingestPdf(list, name) {
  let made = 0, merged = 0; const fid = uid();
  list.forEach(r => { const { isNew } = upsertComp({ mls: r.mls, apn: r.apn, key: r.addr ? addrKey(r.addr) : '', label: r.addr }, 'pdf', r, fid); isNew ? made++ : merged++; });
  logFile(name, 'MLS printout', list.length, fid);
  return `${name}: ${list.length} listings with history (${merged} matched, ${made} new)`;
}
function ingestCrs(r, name) {
  const s = app.job.subject; const key = addrKey(r.addr);
  if ((s.addr && addrKey(s.addr) === key) || (s.apn && apnKey(s.apn) && apnKey(s.apn) === apnKey(r.apn))) { s.crs = r; fillSubjectFrom(r); logFile(name, 'CRS (subject)', 1); return `${name}: subject's CRS report – location and APN filled in`; }
  const fid = uid(); const { isNew } = upsertComp({ apn: r.apn, key, label: r.addr }, 'crs', r, fid); logFile(name, 'CRS report', 1, fid);
  if (!s.addr) (app.crsChoices = app.crsChoices || []).push({ fid, r, name }); // subject not entered yet: offer 'this is the subject'
  return `${name}: ${r.addr} (${isNew ? 'new comp' : 'matched'})`;
}
async function ingestCort(rows, name) {
  const seen = new Set(app.cort.map(r => r.apn + '|' + r.saleDate + '|' + r.doc)); let added = 0; const fid = uid();
  rows.forEach(r => { const k = r.apn + '|' + r.saleDate + '|' + r.doc; if (!seen.has(k)) { seen.add(k); r._file = fid; app.cort.push(r); added++; } });

async function ingestPhotos(f, z) {
  const files = z || await readZip(f); let n = 0; const mlsSet = new Set(); const fid = uid();
  for (const [path, data] of files) {
    const base = path.split('/').pop(); const m = base.match(/^(\d{2}-\d+)_(\d+)\.(jpe?g|png)$/i); if (!m) continue;
    const id = app.job.id + ':' + m[1] + '_' + m[2];

async function ingestJson(f) {

/* Full-size photo viewer: arrows (or the keyboard) to page through, one click to make a photo the front photo */
function openViewer(c, startId) {
  const ps = photosOf(c); let i = Math.max(0, ps.findIndex(p => p.id === startId));
  const bg = document.createElement('div'); bg.className = 'viewer';
  const draw = async () => { const ph = ps[i]; const fr = frontOf(c);
    bg.innerHTML = `<div class="vbar"><b>${esc(compTitle(c))}</b> · photo ${i + 1} of ${ps.length}<span class="grow"></span>
      ${fr && fr.id === ph.id ? '<span class="pill ok">Front photo</span>' : '<button class="btn primary" data-vfront="1">Use as the front photo</button>'}<button class="btn" data-vclose="1">Close ✕</button></div>
      <button class="varr l" data-vstep="-1" aria-label="Previous">‹</button><img class="vimg" alt="Photo ${i + 1}" src="${await photoURL(ph.id)}"><button class="varr r" data-vstep="1" aria-label="Next">›</button>`;
    bg.querySelector('[data-vclose]').onclick = close; bg.querySelectorAll('[data-vstep]').forEach(b => b.onclick = () => step(+b.dataset.vstep));
    const f = bg.querySelector('[data-vfront]'); if (f) f.onclick = () => { c.front = ph.id; save(); draw(); render(); }; };
  const step = d => { i = (i + d + ps.length) % ps.length; draw(); };
  const key = e => { if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'Escape') close(); };
  const close = () => { document.removeEventListener('keydown', key); bg.remove(); };
  document.addEventListener('keydown', key); document.body.appendChild(bg); draw();
}
