<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comp Genie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root{--ink:#000;--muted:#1a1a1a;--line:#d6dce3;--bg:#eef1f4;--card:#fff;--teal:#ff8a00;--teal-d:#b35a00;--teal-l:#ffdcb5;--warn:#b35400;--warn-l:#fff2e5;--bad:#b3261e;--ok:#1e7a3c;--ok-l:#e6f4ea;--sel:#fff8d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{max-width:1500px;margin:0 auto;padding:0 16px 40px}
h1{margin:0;font-size:24px;color:var(--teal-d)}h2{margin:0 0 10px;font-size:19px;color:var(--teal-d)}h2 small,h3 small{color:var(--muted);font-weight:400;font-size:14px}h3{margin:18px 0 6px;font-size:16px;color:var(--teal-d)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-bottom:12px}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
.notice{border-color:#f0c48a;background:var(--warn-l)}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff}.pill.ok{background:var(--ok-l);border-color:#b8dfc4}.pill.warn{background:var(--warn-l);border-color:#f0c48a}
.btn{font:inherit;font-size:14px;border:1px solid #c9d1da;background:#fff;color:var(--teal-d);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--teal-l)}.btn.primary{background:var(--teal);border-color:#000;color:#000;font-weight:600}.btn.primary:hover{background:var(--teal-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sm{padding:3px 8px;font-size:13px}.btn.danger{color:var(--bad);border-color:#e3b2ae}.btn.danger.solid{background:var(--bad);color:#fff}
.lnk{border:0;background:none;color:var(--teal-d);cursor:pointer;font-size:15px;padding:0 2px}
.link{color:var(--teal-d);text-decoration:underline;cursor:pointer}
.txt{font:inherit;border:1px solid #d6dce3;border-radius:7px;padding:7px 9px;width:100%;background:#fff;color:var(--ink)}.txt.big{font-size:17px;padding:10px 12px}.txt.sm{padding:3px 6px;font-size:13px;min-width:90px}
select{font:inherit;font-size:14px;border:1px solid #d6dce3;border-radius:6px;padding:4px 6px;background:#fff;max-width:100%}
.fld{display:flex;flex-direction:column;gap:3px}.fld span{font-size:13px;color:var(--muted)}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.w2{grid-column:span 2}
@media (max-width:900px){.grid6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.help{color:var(--muted);font-size:13.5px;margin:8px 0 0}
.addrow{display:flex;gap:10px;align-items:flex-start}.sugwrap{position:relative;flex:1}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:4;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.08);max-height:320px;overflow:auto}.sugg:empty{display:none}
.sug{display:block;width:100%;text-align:left;border:0;background:#fff;padding:8px 12px;font:inherit;cursor:pointer;border-bottom:1px solid #f3f5f7}.sug:hover{background:var(--teal-l)}.sug small{color:var(--muted)}
.drop{display:block;margin-top:12px;border:2px dashed #c9d1da;border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:#f8fafb}.drop b{color:var(--teal-d)}.drop.over{background:var(--teal-l);border-color:var(--teal)}
.busy{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:20}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}th{font-size:13px;color:var(--muted);font-weight:700}.r{text-align:right}
table.comps tbody tr{cursor:pointer}table.comps tbody tr:hover{background:#fff6ec}table.comps tr.sel{background:var(--sel)}table.comps tr.used td:first-child{border-left:4px solid var(--teal)}
.thumb{width:72px;height:48px;object-fit:cover;border-radius:4px;display:block}.nothumb{display:flex;align-items:center;justify-content:center;width:72px;height:48px;border-radius:4px;background:#f3f5f7;font-size:18px;opacity:.7}
.src{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin:1px 0;background:#fff6ec;white-space:nowrap}
.badge{display:inline-block;min-width:22px;text-align:center;border-radius:999px;background:var(--teal-l);color:var(--teal-d);font-size:12px;font-weight:700;padding:1px 6px}.badge.warn{background:var(--warn-l);color:var(--warn)}
.confirm{display:inline-flex;gap:6px;align-items:center}
.detail{border:2px solid var(--teal)}
.dhead{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:16px}.dhead:has(> div:first-child:empty){grid-template-columns:1fr}
.hero{width:100%;border-radius:8px;display:block}.big{font-size:17px;margin:4px 0 8px}
.flags{margin:6px 0;padding-left:18px}.flags li{margin:3px 0}.flags li.warn{color:var(--warn);font-weight:700}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.ph{border:2px solid transparent;padding:0;border-radius:6px;background:none;cursor:pointer;flex:0 0 auto}.ph img{width:110px;height:74px;object-fit:cover;border-radius:4px;display:block}.ph.on{border-color:var(--teal)}
table.cmp th:first-child{width:210px}table.cmp td.using{font-weight:700;min-width:150px}
table.cmp tr.grp th{background:var(--teal-l);color:var(--teal-d);font-size:14px}
.srccell{cursor:pointer;color:#000;font-size:14px;max-width:260px}.srccell:hover{background:var(--teal-l)}.srccell.on{background:var(--ok-l);color:var(--ink);font-weight:700}.srccell.empty{cursor:default}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;background:#f3f5f7;color:var(--muted);vertical-align:1px}.tag.edit{background:var(--sel);color:#7a5a00}.tag.arch{background:var(--ok-l);color:var(--ok)}
.diff{color:var(--warn);font-weight:700}
table.mini{width:auto;min-width:50%}table.mini tr.hot td{background:var(--sel)}
details{margin:12px 0}summary{cursor:pointer;color:var(--teal-d);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sheet-bg{position:fixed;inset:0;background:rgba(10,30,30,.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}.sheet{background:#fff;border-radius:12px;padding:20px;max-width:720px;width:100%;max-height:85vh;overflow:auto}.sheet li{margin:6px 0}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:40;max-width:420px}
.foot{color:var(--muted);font-size:12.5px;text-align:center;padding:12px}
.jobsel{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}.jobsel select{max-width:260px}
table.cmp{table-layout:fixed;min-width:900px}table.cmp th select{width:100%;font-size:12.5px}table.cmp td,table.cmp th{overflow-wrap:anywhere}
table.comps td.r,table.comps td:nth-child(6){white-space:nowrap}
.files{margin-top:10px;font-size:14px}.files ul{margin:4px 0;padding-left:18px}.files li{margin:3px 0}.files small{color:var(--muted)}
.viewer{position:fixed;inset:0;background:rgba(8,20,20,.92);z-index:50;display:flex;align-items:center;justify-content:center}
.vbar{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:10px 16px;background:rgba(255,255,255,.96)}
.vimg{width:calc(100vw - 140px);height:calc(100vh - 90px);object-fit:contain;margin-top:50px;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.varr{position:absolute;top:50%;transform:translateY(-50%);font-size:44px;width:56px;height:84px;border:0;border-radius:8px;background:rgba(255,255,255,.85);cursor:pointer}.varr.l{left:12px}.varr.r{right:12px}
.hero{cursor:zoom-in}
/* adjustment grid */
table.grid{border-collapse:collapse;min-width:100%;font-size:14px}table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.grid thead th{position:sticky;top:0;background:var(--card);min-width:150px}table.grid thead th:first-child{min-width:210px}
table.grid tr.grp th{background:var(--teal-l);color:var(--teal-d);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
table.grid td.subj{background:#f8fafb}table.grid .gval{min-height:18px;margin-bottom:4px}table.grid input.adj{width:110px;text-align:right}table.grid input.adj.own{font-weight:700;border-color:var(--teal)}
table.grid input.adj.auto::placeholder{color:var(--teal-d);font-style:italic;opacity:1}table.grid .grate{font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}table.grid .grate input{width:80px}
table.grid tr.tot td,table.grid tr.tot th{background:#fff6ec}table.grid tr.big td{font-size:16px}small.over{color:var(--bad);font-weight:700}.measure{color:var(--bad);font-weight:700}
.gsum{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.gsum>div,.gsum>label{background:var(--teal-l);border-radius:8px;padding:8px 12px;display:grid;gap:2px;min-width:160px}.gsum span{font-size:12px;color:var(--muted)}.gsum b{font-size:18px}
input.xs{width:80px}
/* report details */
.rptgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px 22px}
.rptgrid section h3{margin:4px 0 8px}
.rptgrid .fld{display:block;margin:0 0 8px}.rptgrid .fld>span{display:block;font-size:.85em;color:var(--muted,#5b6876)}
.rptgrid .fld input.txt,.rptgrid .fld textarea{width:100%;box-sizing:border-box}
.rptgrid label.check{display:block;margin:2px 0}
.rptgrid input::placeholder,.rptgrid textarea::placeholder{color:#000}
.warnTxt{color:#e00000}
.review{margin-top:16px;border-top:2px solid var(--line,#d6dde3);padding-top:8px}
.rv{display:grid;grid-template-columns:110px 1fr minmax(160px,30%);gap:6px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line,#e6eaee)}
.rv.ok{opacity:.55}.rv .btn{grid-column:3}
.rvs{font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px;background:#eef1f4;text-align:center}
.rv-Direction,.rv-Math{background:#fde2e1;color:#a51111}.rv-Limit{background:#fff1d6;color:#8a5300}.rv-Notadjusted,.rv-Consistency,.rv-Bracketing,.rv-Check{background:#e8f0fb;color:#1d4f91}
select.fine{font-size:12px;padding:1px 2px;margin-left:4px;border-radius:4px}
.starts{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 10px;margin:6px 0 10px;background:#f3f5f7;border-radius:8px}.starts small{flex-basis:100%;color:#000}
.stedit{flex-basis:100%;margin-top:6px}.stedit table{border-collapse:collapse;margin:6px 0}.stedit th,.stedit td{padding:4px 8px;text-align:left;font-size:13px;vertical-align:top}
.grate small.from{display:block;color:#0b7a5a;font-size:11px}
.nuask{background:#fff6e0;border:1px solid #f0c060;padding:8px 10px;border-radius:8px;margin:6px 0}
.nu{border-bottom:1px solid #e3e8ec;padding:8px 0}.nuh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}.nur{display:flex;flex-wrap:wrap;gap:4px 10px;margin:6px 0}
.chip2{display:inline-flex;gap:4px;align-items:center;font-size:13px;border:1px solid #d6dde3;border-radius:14px;padding:2px 8px}.inl{display:inline-flex;gap:4px;align-items:center;font-size:13px}
.rmask{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.bedask{margin-top:6px;padding:6px 8px;background:#fff1d6;border:1px solid #f0c060;border-radius:6px;font-weight:600;font-size:13px;color:#7a4b00}
tr.asking th{background:#fffaf0}
table.ts{border-collapse:collapse;width:100%;margin:8px 0}table.ts th,table.ts td{border-bottom:1px solid #e3e8ec;padding:8px;text-align:left;vertical-align:top}table.ts th{width:34%;font-weight:600}
table.ts.small td,table.ts.small th{font-size:12px;padding:4px 6px}
.tschart{width:100%;max-width:720px;height:auto;margin:6px 0}.tschart .ln{fill:none;stroke:#0b7a5a;stroke-width:2.5}.tschart .pt{fill:#0b7a5a}.tschart .gl{stroke:#e3e8ec}.tschart .tl{font-size:11px;fill:#5b6876}
p.warn{color:#8a5300;background:#fff6e0;padding:6px 8px;border-radius:6px}
select.fine.arch{background:#eef6ff;border:1px dashed #6a9fd8}
.sens{margin-top:18px;border-top:1px solid #ddd;padding-top:10px}
table.senst{border-collapse:collapse;font-size:13px}table.senst td,table.senst th{border-bottom:1px solid #eee;padding:5px 8px;text-align:left;vertical-align:top}
.sens .warn{color:#9a5b00}svg.spark{display:block}
table.sup td:nth-child(4){white-space:nowrap}table.sup td:last-child{min-width:260px}table.sup td:nth-child(2){white-space:nowrap}
.rv-Mustfix{background:#c0392b;color:#fff}.rv-Check{background:#e8a33d;color:#fff}
#preCard .ok{color:#2a7a3a;font-weight:600}.revlog{margin-top:14px}.revlog .rev{padding:4px 0;border-bottom:1px solid #eee}.revlog #revText{min-width:340px}label.tick{white-space:nowrap;margin-left:8px;font-size:13px}
.wbbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#f4f8fb;border:1px solid #dbe6ee;border-radius:8px;padding:8px 10px;margin:8px 0}
.wbbar .pops .btn{margin-left:4px}.wbarr{background:#fafafa;border:1px solid #e5e5e5;border-radius:8px;padding:8px 10px;margin-bottom:8px}.wbarr div{padding:3px 0}
.keys{font-size:12px}table.grid th.cur{background:#fff4d6;outline:2px solid #e8a33d}table.grid th[data-wbcol]{cursor:pointer}
table.grid.wb input.fact{width:100%;min-width:110px;margin-bottom:3px;background:#fffef6}
.wbundo{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 14px;border-radius:10px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.3)}
header.top.pop{gap:8px}header.top.pop h1{font-size:18px}
.cmtbtn{margin-left:8px;font-size:12px;padding:1px 8px}
.cpk{position:fixed;inset:0;background:rgba(20,30,40,.35);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px}
.cpkbox{background:#fff;border-radius:12px;max-width:900px;width:100%;max-height:85vh;overflow:auto;padding:14px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.cpkbox #cpkQ{min-width:320px}.cpki{border-top:1px solid #eee;padding:8px 0}.cpkt{font-size:13px;line-height:1.4;color:#000;margin-top:4px}
.vt{padding:1px 7px;border-radius:9px;background:#eef1f4}.vt.v26{background:#fff1d6;color:#8a5a00}.vt.v36{background:#e1f2e6;color:#226b3a}.vt.vboth{background:#e6eefb;color:#2c4f8a}mark.blank{background:#fff3a8;padding:0 2px}
.draft{margin:8px 0;padding:8px 10px;background:#f7faf7;border:1px solid #dfe9df;border-radius:8px}.draft textarea{width:100%;font-size:13px;line-height:1.45;margin:6px 0}
.charct{font-size:12px;color:#000;margin:2px 0 6px}.charct .over{color:#b3261e}
table.comps td.usecell{white-space:nowrap}table.comps td.usecell .btn{margin-right:4px;padding:2px 8px}

/* the Appraisal Assistant's look (her request, Oct 19 2026): same colors and type as the hub */
h1,h2{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:600;color:var(--ink)}h1{font-size:28px}h2{font-size:22px}h3{color:var(--teal-d)}
.btn{color:var(--ink);border-color:#c9d1da}.btn:hover{background:#fff3e6}.btn.primary:hover{background:#ffa033}
.card{border-radius:14px;box-shadow:0 1px 2px rgba(20,32,45,.08),0 8px 24px rgba(20,32,45,.06)}
a{color:var(--teal-d)}
body.embed .top h1{display:none}body.embed #app{padding-top:0}body.embed .top{padding:8px 0}
.detail .dstick{position:sticky;top:var(--toph,64px);z-index:4;background:var(--card);margin:-16px -16px 10px;padding:12px 16px 6px;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.detail .dstick .hero{max-height:150px;width:auto}.detail .dstick .strip img{max-height:56px}
td.srccell.prmls{background:#f3f5f7;cursor:default}
/* all 8+ comps across one screen, the line names stay put when the grid scrolls sideways (her request, Oct 19 2026) */
table.grid input.fact{width:112px;margin-bottom:3px;background:#fffef6}
table.grid thead th{min-width:128px}table.grid input.adj{width:112px}
table.grid tbody th:first-child,table.grid thead th:first-child{position:sticky;left:0;z-index:3;background:var(--card);box-shadow:1px 0 0 var(--line)}
table.grid thead th:first-child{z-index:5}table.grid tr.grp th:first-child{background:var(--teal-l)}
table.grid td input.txt{width:112px;min-width:0;box-sizing:border-box}table.grid td select.fine{max-width:100%}table.grid thead th[data-wbcol]{min-width:118px;width:130px}
table.grid.wb input.fact{width:112px;min-width:0}table.grid td select.fine{width:112px}
/* vertical lines between the comps (her request, Oct 19 2026) */
table.grid td+td,table.grid th+th{border-left:1px solid #c9d1da}table.grid td.subj{border-right:2px solid #c9d1da}
table.grid tr.info th,table.grid tr.info td{background:#fafbfc}
table.grid tbody th:first-child,table.grid thead th:first-child{width:230px;max-width:250px;white-space:normal}
table.grid{min-width:0;width:auto}table.grid td.subj{width:140px}
/* comp history (history.js) */
.hist { position: fixed; inset: 0; background: rgba(20, 30, 40, .35); z-index: 60; display: grid; place-items: start center; padding: 40px 16px; overflow: auto; }
.histcard { background: var(--panel, #fff); color: var(--ink, #1c2631); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 16px 20px; width: min(1050px, 100%); }
.histcard h2 { margin: 0; font-size: 18px; }
.hlist tr.hgrp th { background: var(--accent-soft, #fde8d2); text-align: left; font-weight: 700; }
.hlist tr.hrow { cursor: pointer; } .hlist tr.hrow:hover, .hlist tr.hrow.on { background: rgba(0,0,0,.04); }
.hlist td.acts { white-space: nowrap; } .hlist td.acts .btn { margin-left: 4px; }
.hfields { font-size: 13px; } .hfields th { text-align: left; font-weight: 600; padding-right: 12px; color: var(--muted, #5b6876); }
.hcmt { border-left: 3px solid var(--accent, #e07b00); padding: 4px 10px; margin: 6px 0; background: rgba(0,0,0,.02); } .hcmt p { margin: 4px 0; white-space: pre-wrap; }
/* land sales: filters, Use ticks, site value (Oct 20 2026) */
.landf { gap: 10px; flex-wrap: wrap; } .landf .txt.num { width: 7.5em; display: inline-block; }
tr.landon td { background: #eefbf3; }
.landused { border: 2px solid #0fa84a; border-radius: 10px; padding: 10px 14px; margin-top: 10px; background: #fbfffc; } .landused h3 { margin: 0 0 4px; }
.landused textarea { width: 100%; }

.crsneed { border: 3px solid #c00000; background: #fff3f3; border-radius: 12px; padding: 10px 14px; margin: 10px 0; } .crsneed > b { color: #b00000; } .crsneed ul { margin: 6px 0 10px; padding-left: 22px; } .crsok { margin: 8px 0; }

.photoneed{border-left:4px solid #e08a00;padding-left:10px;margin:8px 0}

/* comp page: only one short line stays at the top while she scrolls; flags and photos scroll away (her note, Oct 20 2026: on the landscape monitor the header covered most of the screen) */
.detail .dstick{padding:8px 16px 8px}
.detail .dline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.detail .dline h2{margin:0;font-size:20px}.detail .dline .big{font-size:15px}.detail .dline label{font-size:14px}
.detail .dline .mini-hero{height:38px;width:auto;border-radius:4px;cursor:zoom-in}
.detail .dmore{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start;margin-bottom:8px}
.detail .dmore .dinfo{flex:1 1 420px;min-width:0}
.detail .dmore .flags{columns:2 340px;column-gap:28px;margin:6px 0}
.detail .dmore .dphotos{flex:0 1 520px}.detail .dmore .hero{max-height:150px;width:auto;display:block;margin-bottom:6px}
.detail .dmore .strip img{max-height:56px}

const DB = (() => {

const RX_LISTING = /^- (\d{2}-\d+)\s+([A-Za-z][A-Za-z /]*?)\s+\$([\d,]+)\s+(?:(-?[\d.,]+)%\s+)?(\d{2}\/\d{2}\/\d{4})\s+(\d+)?\s*(\d+)?\s*(.*)$/;

function parseMlsPdf(L) {
  const out = []; let cur = null, mode = '', hist = null, ev = null, colLabel = ['', ''];
  const flat = i => L.rows[i].map(c => c.s).join(' ').replace(/\s+/g, ' ').trim();
  for (let i = 0; i < L.length; i++) {
    const line = flat(i); const cells = L.rows[i];
    if (/^flexmls Web/.test(line) || /^\d+ of \d+ /.test(line) || /^\+ MLS #/.test(line)) continue;
    let m = line.match(/^MLS #\s?(\d{2}-\d+)$/);

    if (!cur) continue;
    if ((m = line.match(/^History for MLS # ?(\d{2}-\d+)/))) { mode = 'history'; hist = null; ev = null; continue; }
    if (/^(Supplement|Photos|Documents|Floor ?plans?) for MLS #/.test(line) || /^MLS # \d{2}-\d+ /.test(line)) { mode = 'skip'; continue; }
    if (/^Information is deemed|^Information may be|^2026 MLS and FBS|^not be the listing/.test(line)) continue;

      cells.forEach(c => {

        cur.history.push(hist); ev = null; continue;
      }

}

/* sale type from the agent remarks (Oct 20 2026) – first match wins; "not a short sale", "real estate" etc. are ignored */
function remarkSaleType(t) {

  const clean = t.replace(/\b(not|no|isn'?t|never)\s+(an?\s+)?(short\s+sale|reo|probate|bank[- ]owned|foreclosure|estate\s+sale|trust\s+sale|court\s+(confirmation|approval)|divorce)/gi, x => ' '.repeat(x.length)).replace(/real\s+estate/gi, x => ' '.repeat(x.length));

    ['CrtOrd', /probate|court\s+(confirmation|approval|ordered|order)|overbid|conservator|bankruptcy|IAEA|divorce|dissolution/i], ['Estate', /estate\s+sale|estate\s+of\b|heirs|inherited|successor\s+trustee|trust\s+sale|sold\s+by\s+(the\s+)?trust/i],

  for (const [type, re] of R) { const m = clean.match(re); if (m) { const i = m.index; return { type, words: (i > 30 ? '\u2026' : '') + t.slice(Math.max(0, i - 30), i + m[0].length + 30).replace(/\s+/g, ' ').trim() + '\u2026' }; } }

/* her note (Oct 20 2026): the MLS Financing column is a Flexmls code number, not the terms – the MLS only knows the financing when the agent wrote it in the remarks at closing.

  const t = String(rem || ''); const m = t.match(/\b(all[- ]cash|cash\s+(buyer|offer|sale|only|transaction)|paid\s+cash|FHA|VA\s+loan|\bVA\b(?=\s*(financ|buyer|offer))|conventional|USDA|seller\s+(carry|financ\w*|carried)|owner\s+(will\s+)?carry)\b/i);

function xsdSort(node) {   // put every element's children in schema order (unknown ones keep their place at the end)
  const seq = XSD_ORDER[node.localName]; const kids = [...node.children];
  if (seq && kids.length > 1) { const idx = n => { const i = seq.indexOf(n.localName); return i < 0 ? 1e6 : i; };
    const sorted = kids.map((k, i) => [k, i]).sort((a, b) => idx(a[0]) - idx(b[0]) || a[1] - b[1]).map(a => a[0]);
    if (sorted.some((k, i) => k !== kids[i])) sorted.forEach(k => node.appendChild(k)); }
  for (const k of node.children) xsdSort(k);
}
function xsdSortXML(xml) { try { const d = new DOMParser().parseFromString(xml, 'application/xml'); if (d.getElementsByTagName('parsererror').length) return xml; xsdSort(d.documentElement);
  const head = (xml.match(/^<\?xml[^>]*>\s*(<!--[\s\S]*?-->\s*)?/) || [''])[0]; return head + new XMLSerializer().serializeToString(d.documentElement); } catch (e) { return xml; } }

  const a = J.subject.addr || ''; if (!a) return out; const p = splitAddr(a); const key = addrKey(p.no, p.street, J.subject.unit || p.unit);

/* =====================================================================
   Maps and exhibits (her request, Oct 20 2026): a location map of the subject and every comp on the grid (and rentals,
   when there is a rent survey), labeled like her SFREP maps; an aerial view of the subject; a flood map.
   Drawn in the browser from public map tiles and saved as JPEG pictures; the full report puts them in SFREP as
   Sales Comparable Map / Rental Comparable Map / Site exhibits.

   - Aerial: USGS National Map imagery (public domain). Or her own picture (CRS Property Report).
   - Flood: FEMA National Flood Hazard Layer (public). Or her own picture (CRS flood map).
   A comp without latitude / longitude is looked up by address (OpenStreetMap Nominatim, one per second).

const MAPS = { busy: '' };
const TILE = 256;
const MAP_SRC = {
  street: { url: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`, max: 19, credit: 'Map data © OpenStreetMap contributors' },
  aerial: { url: (z, x, y) => `https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/${z}/${y}/${x}`, max: 16, credit: 'Imagery: USGS The National Map' },

const lon2x = (lon, z) => (lon + 180) / 360 * TILE * 2 ** z;
const lat2y = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * TILE * 2 ** z; };

async function mapsGet(J) { const r = await DB.get('kv', 'maps:' + J.id); return (r && r.v) || {}; }

const geoOf = c => { const la = num(V(c, 'lat')), lo = num(V(c, 'lon')); if (la && lo) return { lat: la, lon: lo }; return c.geo && c.geo.lat ? c.geo : null; };

/* ---- comps with no latitude / longitude: look the address up ---- */
async function geocodeMissing(J, list) {
  const need = list.filter(c => !geoOf(c)); let n = 0, miss = [];
  for (const c of need) {

    MAPS.busy = `Finding ${compTitle(c)} on the map…`; mapsRender();
    try { const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(q)); const a = await r.json();

/* ---- draw tiles for a box of points on a canvas ---- */
async function drawBase(ctx, W, H, pts, src, pad, maxZ) {
  const S = MAP_SRC[src]; let z = Math.min(S.max, maxZ || S.max);
  const fits = zz => { const xs = pts.map(p => lon2x(p.lon, zz)), ys = pts.map(p => lat2y(p.lat, zz)); return Math.max(...xs) - Math.min(...xs) <= W - 2 * pad.x && Math.max(...ys) - Math.min(...ys) <= H - 2 * pad.y; };

  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2; const ox = cx - W / 2, oy = cy - H / 2;
  const t0x = Math.floor(ox / TILE), t1x = Math.floor((ox + W) / TILE), t0y = Math.floor(oy / TILE), t1y = Math.floor((oy + H) / TILE);
  ctx.fillStyle = '#e8eef2'; ctx.fillRect(0, 0, W, H); let bad = 0; const jobs = [];

function credit(ctx, W, H, text) { ctx.font = '600 15px Arial'; const w = ctx.measureText(text).width + 14; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(W - w - 6, H - 28, w, 22); ctx.fillStyle = '#333'; ctx.fillText(text, W - w + 1, H - 12); }

/* ---- labeled callouts that do not overlap (her SFREP map style) ---- */
function callouts(ctx, W, H, items) {
  const F = 27, LH = 32; const boxes = [];
  const over = (a, b) => a.x < b.x + b.w + 10 && a.x + a.w + 10 > b.x && a.y < b.y + b.h + 10 && a.y + a.h + 10 > b.y;
  const segHits = (x1, y1, x2, y2, r) => { // does the pointer line cross box r?
    for (let t = 0.08; t <= 0.92; t += 0.04) { const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) return true; } return false; };
  const cx0 = items.reduce((t, i) => t + i.px[0], 0) / items.length, cy0 = items.reduce((t, i) => t + i.px[1], 0) / items.length;
  // labels go outward from the middle of the group, like her SFREP maps; the subject first
  const order = items.slice().sort((a, b) => (b.kind === 'subj') - (a.kind === 'subj'));
  for (const it of order) {
    const lw = Math.max(...it.lines.map((l, i) => { ctx.font = (i === 0 ? 'bold ' : '') + F + 'px Arial'; return ctx.measureText(l).width; }));
    const w = Math.ceil(lw + 34), h = it.lines.length * LH + 20; let best = null, bestScore = 1e9;

    for (let r = 110; r < 900; r += 40) for (let k = 0; k < 24; k++) {
      const off = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (Math.PI / 12); const ang = base + off; const cx = it.px[0] + Math.cos(ang) * r, cy = it.px[1] + Math.sin(ang) * r;
      const a = { x: Math.round(cx - w / 2), y: Math.round(cy - h / 2), w, h };
      if (a.x < 10 || a.y < 10 || a.x + w > W - 10 || a.y + h > H - 40) continue;
      if (boxes.some(bx => over(a, bx))) continue;
      if (items.some(o => o.px[0] > a.x - 12 && o.px[0] < a.x + a.w + 12 && o.px[1] > a.y - 12 && o.px[1] < a.y + a.h + 12)) continue;

  for (const it of order) { const b = it.box; const c = col(it);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#111'; ctx.textAlign = 'center'; it.lines.forEach((l, i) => { ctx.font = (i === 0 ? 'bold ' : '') + F + 'px Arial'; ctx.fillText(l, b.x + b.w / 2, b.y + 34 + i * LH); }); ctx.textAlign = 'left'; }

}
const dirShort = d => ({ North: 'N', South: 'S', East: 'E', West: 'W', NorthEast: 'NE', NorthWest: 'NW', SouthEast: 'SE', SouthWest: 'SW' }[String(d || '').replace(/\s/g, '')] || d);
const toJpeg = cv => new Promise(res => cv.toBlob(res, 'image/jpeg', 0.9));
function addrLines(addr, city, zip) { return [addr, [city, 'CA', zip].filter(Boolean).join(' ').replace(' CA', ', CA')]; }

/* ---- the location map: subject + grid comps (+ rentals / land sales she ticked) ---- */
async function makeLocationMap(J, kind) {
  const S = J.subject; const sp = { lat: num(S.lat), lon: num(S.lon) };
  if (!sp.lat || !sp.lon) { toast('The subject has no latitude / longitude yet – drop the subject’s CRS report (or your iPad workfile) first', 7000); return; }
  const list = kind === 'rent' ? (J.rentals || []).filter(r => r.use) : usedComps(J);
  if (!list.length) { toast(kind === 'rent' ? 'Add the rentals first (Income approach)' : 'Put comps on the grid first'); return; }
  if (kind === 'rent') { MAPS.busy = 'Finding the rentals on the map…'; mapsRender(); const miss = await geocodeRentals(J); if (miss.length) toast('Not found on the map: ' + miss.join(', '), 8000); }
  if (kind !== 'rent') { const g = await geocodeMissing(J, list); if (g.miss.length) toast('Not found on the map: ' + g.miss.join(', ') + ' – add its latitude / longitude (CRS report) and make the map again', 8000); }

}

/* ---- aerial view of the subject (USGS imagery, public domain) ---- */
async function makeAerial(J) {
  const S = J.subject; const sp = { lat: num(S.lat), lon: num(S.lon) }; if (!sp.lat) { toast('The subject has no latitude / longitude yet'); return; }
  MAPS.busy = 'Drawing the aerial view…'; mapsRender();
  const W = 1600, H = 1200; const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  // one point: drawBase picks the highest zoom the imagery has; scale the tiles up 2× for a closer lot view
  const z = MAP_SRC.aerial.max; const half = { x: W / 4, y: H / 4 }; const cx = lon2x(sp.lon, z), cy = lat2y(sp.lat, z); const ox = cx - half.x, oy = cy - half.y;

  const M = await mapsGet(J); M.aerial = { blob, at: Date.now(), src: 'USGS', use: true }; await mapsPut(J, M); toast('Aerial view made'); mapsRender();

/* ---- flood map: FEMA flood hazard zones over the street map, with the zone at the subject ---- */
const NFHL = 'https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer';

    const r = await (await fetch(u)).json(); const a = r && r.features && r.features[0] && r.features[0].attributes; if (!a) return null;
    return { zone: a.FLD_ZONE, sub: a.ZONE_SUBTY || '', sfha: a.SFHA_TF === 'T', dfirm: a.DFIRM_ID || '' }; } catch (e) { return null; } }
async function femaPanelAt(p) {   // FIRM Panels layer (3)

    const r = await (await fetch(u)).json(); const a = r && r.features && r.features[0] && r.features[0].attributes; if (!a) return null;
    return { panel: a.FIRM_PAN, date: a.EFF_DATE ? new Date(a.EFF_DATE).toISOString().slice(0, 10) : '' }; } catch (e) { return null; } }
async function makeFloodMap(J) {
  const S = J.subject; const sp = { lat: num(S.lat), lon: num(S.lon) }; if (!sp.lat) { toast('The subject has no latitude / longitude yet'); return; }
  MAPS.busy = 'Drawing the flood map…'; mapsRender();
  const W = 1600, H = 1300; const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  // about a half-mile around the subject

  bg.innerHTML = `<div class="sheet"><h2>Files read</h2><ul>${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul><div class="row"><button class="btn primary" data-close="1">OK</button>${(crsChoices || []).map((ch, i) => `<button class="btn primary" data-subj-crs="${i}">${esc(ch.r.addr || ch.name)} is the subject</button>`).join('')}${(fileIds || []).length ? `<button class="btn danger" data-undo="1">Undo – take ${fileIds.length > 1 ? 'these files' : 'this file'} back out</button>` : ''}</div></div>`;
  document.body.appendChild(bg); bg.querySelector('[data-close]').onclick = () => bg.remove(); bg.querySelector('[data-close]').focus();
  bg.querySelectorAll('[data-subj-crs]').forEach(b => b.onclick = async () => { await useCrsAsSubject(crsChoices[+b.dataset.subjCrs]); bg.remove(); render(); toast('Subject filled from the CRS report'); });
  const u = bg.querySelector('[data-undo]'); if (u) u.onclick = async () => { u.disabled = true; u.textContent = 'Taking out…'; for (const id of fileIds) await removeFile(id); bg.remove(); render(); toast('Undone – nothing from ' + (fileIds.length > 1 ? 'those files' : 'that file') + ' is left'); };
}

/* ---------------- exports ---------------- */
function jobBase() { return safeName(app.job.subject.addr || app.job.name); }
async function exportSfrep() {
  const used = app.job.comps.filter(c => c.use).sort((a, b) => a.use - b.use); if (!used.length) return;
  const entries = [{ name: jobBase() + ' - Comps.xml', data: buildCompsMISMO(app.job, used) }];
  for (const c of used) { const fr = frontOf(c); if (fr) { const r = await DB.get('photos', fr.id); if (r) entries.push({ name: 'Images/' + photoName(c), data: r.blob }); } }
  download(await makeZip(entries), jobBase() + ' - Comps SFREP.zip'); toast('Saved to your Downloads folder');
}
function exportCsv() {
  const used = app.job.comps.filter(c => c.use).sort((a, b) => a.use - b.use);
  const list = [...used, ...app.job.comps.filter(c => !c.use)];
  download(new Blob([compsCSV(app.job, list)], { type: 'text/csv' }), jobBase() + ' - Comps considered.csv');
}
async function exportPhotos() {
  const used = app.job.comps.filter(c => c.use); const list = used.length ? used : app.job.comps; const entries = []; const names = new Set();
  for (const c of list) { const fr = frontOf(c); if (!fr) continue; const r = await DB.get('photos', fr.id); if (!r) continue; let nm = safeName(compTitle(c)) + '.jpg'; let i = 2; while (names.has(nm)) nm = safeName(compTitle(c)) + ' (' + i++ + ').jpg'; names.add(nm); entries.push({ name: nm, data: r.blob }); }
  if (!entries.length) { toast('No photos yet – drop the MLS photos zip first'); return; }
  download(await makeZip(entries), jobBase() + ' - Comp photos.zip');
}
async function backupJob() {
  const my = await DB.get('kv', 'mycomps');   // her comp database rides along in every backup (Oct 20 2026), so it is never only in this browser
  const blob = await gzipBlob(JSON.stringify({ app: 'comp-genie-job', version: 1, job: app.job, myComps: (my && my.v) || [] }));
  download(blob, safeName(app.job.name) + ' - Comp Genie backup.json.gz');
}

const HW_SYS = `You help Jennifer, a California certified residential appraiser in Santa Barbara County, word comments for UAD 3.6 (redesigned URAR, Fannie Mae / Freddie Mac) reports. She is the expert: she knows UAD 3.6, USPAP and her market.
Rewrite her draft so it reads clearly and professionally in HER style. Rules:
- Keep every fact, number, date, rating and conclusion she wrote. Never add facts, numbers, adjustments, opinions or conclusions she did not state.
- Her vocabulary – keep it, never "correct" it: SBMLS (Santa Barbara MLS; never spell it out), Flexmls, Home/Estate (HE), district numbers, "market area" (never "neighborhood"), "finished area above grade" / "below grade" and "ANSI Z765" (UAD 3.6 terms; do not change them to GLA), Q1–Q6 and C1–C6 UAD ratings with her tiers written as she writes them ("high Q4", "low C3", "Q4+", "C3-"; a tier is her own refinement of the UAD rating – keep it, do not question it), "primary bedroom", "the appraiser", "effective date", "look-back period", "competing properties", "macro market area" (market area boundary search) and "micro market" (search criteria / competing properties).
- UAD 3.6 puts many facts in their own fields (counts, price ranges, days on market, boundaries, sources, ratings, sizes). Write only what belongs in THIS box (its definition is given). Do not add or ask for facts that have their own field.
- Plain, factual, objective wording that complies with USPAP: no advocacy, no guarantees, no marketing language, no exclamation marks, third person. Short sentences. Keep her order of ideas.
- No biased or subjective wording and nothing about protected classes (race, color, religion, national origin, sex, familial status, disability, age): never desirable, pride of ownership, safe, crime, exclusive, prestigious, upscale, family-friendly, master bedroom.
- Stay within the character limit.
"check": at most 3 items, only things genuinely required for THIS box by UAD 3.6 or USPAP that her draft leaves out, or a real inconsistency inside her draft. Never ask her to define her standard abbreviations or tiers, to confirm a term above, or to add something that has its own UAD field. Usually "check" is empty.
Reply with JSON only: {"text": "the rewritten comment", "changes": ["short note of what you changed"], "check": []}`;
async function hwRun(ta, box) {
  const draft = ta.value.trim(); const say = (h, cls) => { box.innerHTML = `<div class="hw-msg ${cls || ''}">${h}</div>`; };
  if (!draft) return say('Type what you want to say first, in your own words – then tap Help me write.');
  const mode = hwOrderAi(ta);
  if (mode === 'No') return say('This order is set to <b>No AI</b>, so nothing is sent. Change the order’s AI use to Yes or Redacted to use Help me write.', 'warn');
  if (!hwKey()) { if (typeof app !== 'undefined' && app.ins) { say(`No Claude key on this iPad yet. Paste it once (the same key as on your computer – Appraisal Assistant › Standard wording › AI settings). It stays on this iPad only.<div class="hw-row" style="margin-top:6px"><input type="password" class="txt hw-key" placeholder="sk-ant-…" style="flex:1;min-width:200px"><button type="button" class="btn sm hw-keysave">Save key</button></div>`, 'warn');
      const b = box.querySelector('.hw-keysave'); if (b) b.onclick = () => { const v = (box.querySelector('.hw-key').value || '').trim(); if (!/^sk-/.test(v)) { alert('That does not look like a Claude key (it starts with sk-).'); return; } try { localStorage.setItem('aa.claudeKey', v); } catch (e) {} hwRun(ta, box); }; return; }
    return say('No Claude key is saved on this computer. Add it in the Appraisal Assistant › Standard wording › AI settings.', 'warn'); }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return say('No internet here – Help me write needs a connection. Your draft is saved; try again when you have signal.', 'warn');
  const lim = +ta.getAttribute('maxlength') || 0; const text = hwScrub(draft, mode);
  say('Claude is writing…');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': hwKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: hwModel(), max_tokens: 2000, system: HW_SYS + (hwRules() ? '\nHer own standing rules (follow them):\n' + hwRules() : ''), messages: [{ role: 'user', content: `Comment box: ${hwWhat(ta)}\nCharacter limit: ${lim || 'none stated (keep it as short as the content allows)'}\n\nHer draft:\n${text}` }] }) });
    const j = await res.json(); if (!res.ok) throw new Error((j.error && j.error.message) || 'Claude answered with an error (' + res.status + ')');
    const out = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join(''); const J = JSON.parse(out.slice(out.indexOf('{'), out.lastIndexOf('}') + 1));
    let t = String(J.text || '').trim(); if (!t) throw new Error('no text came back');
    const flags = [...new Set((t.match(HW_BIAS) || []).map(x => x.toLowerCase()))];
    box.innerHTML = `<div class="hw-out"><b>Suggested wording</b> <small>${t.length.toLocaleString()}${lim ? ' / ' + lim.toLocaleString() : ''} characters – read it and change anything before you use it</small>
      <textarea class="txt hw-txt" rows="${Math.min(14, 3 + Math.round(t.length / 95))}">${hwEsc(t)}</textarea>
      ${flags.length ? `<p class="hw-msg warn">Check these words: ${flags.map(hwEsc).join(', ')}</p>` : ''}${lim && t.length > lim ? `<p class="hw-msg warn">Over the ${lim.toLocaleString()} character limit – shorten it before you use it.</p>` : ''}
      ${(J.changes || []).length ? `<details><summary>What was changed</summary><ul>${J.changes.map(x => `<li>${hwEsc(x)}</li>`).join('')}</ul></details>` : ''}
      ${(J.check || []).length ? `<div class="hw-check"><b>You may want to check or add:</b><ul>${J.check.map(x => `<li>${hwEsc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="hw-row"><button type="button" class="btn primary sm hw-use">Use this</button><button type="button" class="btn sm hw-keep">Keep mine</button><button type="button" class="btn sm ghost hw-again">Try again</button></div></div>`;
    box.querySelector('.hw-use').onclick = () => { const v = box.querySelector('.hw-txt').value; ta.value = lim ? v.slice(0, lim) : v; ['input', 'change'].forEach(ev => ta.dispatchEvent(new Event(ev, { bubbles: true }))); box.innerHTML = '<div class="hw-msg ok">✓ Your comment box has the new wording. Read it once more before it goes in the report.</div>'; };

}
const hwRules = () => { try { return localStorage.getItem('aa.hwRules') || ''; } catch (e) { return ''; } };
function hwRulesUI(box) {
  box.innerHTML = `<div class="hw-out"><b>My writing rules</b> <small>one per line – used every time Help me write runs (kept on this computer)</small>
    <textarea class="txt hw-rules" rows="6" placeholder="e.g. Write SBMLS, never spell it out.&#10;Use “high Q4” / “low C3” for my tiers.&#10;Do not list the number of sales – it is in the Search Result Metrics.">${hwEsc(hwRules())}</textarea>
    <div class="hw-row"><button type="button" class="btn primary sm hw-rsave">Save my rules</button><button type="button" class="btn sm hw-keep">Close</button></div></div>`;
  box.querySelector('.hw-rsave').onclick = () => { try { localStorage.setItem('aa.hwRules', box.querySelector('.hw-rules').value.trim()); } catch (e) {} box.innerHTML = '<div class="hw-msg ok">✓ Saved – Help me write follows these from now on.</div>'; };

}
const hwEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hwAttach(root) {
  (root || document).querySelectorAll(HW_SEL).forEach(ta => { if (ta.dataset.hw) return; ta.dataset.hw = '1';
    const wrap = document.createElement('div'); wrap.className = 'hw'; wrap.innerHTML = '<button type="button" class="btn sm hw-btn" title="Type what you want to say, then tap: Claude suggests clearer, UAD 3.6 / USPAP wording with no biased words. You decide whether to use it.">✍ Help me write</button> <button type="button" class="btn sm ghost hw-rbtn" title="Your standing rules for Help me write">My writing rules</button><div class="hw-box"></div>';
    ta.insertAdjacentElement('afterend', wrap); wrap.querySelector('.hw-btn').onclick = () => hwRun(ta, wrap.querySelector('.hw-box')); wrap.querySelector('.hw-rbtn').onclick = () => hwRulesUI(wrap.querySelector('.hw-box')); });
}
if (typeof document !== 'undefined') {
  const st = document.createElement('style'); st.textContent = `.hw{margin:6px 0 10px}.hw-btn{background:#f3ecff;border-color:#7b5cc4;color:#3d2a7a}.hw-msg{font-size:14px;margin:6px 0;padding:6px 10px;border-radius:8px;background:#f5f5f5}.hw-msg.warn{background:#fff1e0;color:#8a4500}.hw-msg.ok{background:#eefbf3;color:#0a4d27}
.hw-out{border:2px solid #7b5cc4;border-radius:10px;padding:10px 12px;margin-top:6px;background:#fbf9ff}.hw-out textarea{width:100%;margin:6px 0}.hw-row{display:flex;gap:8px;flex-wrap:wrap}.hw-check{font-size:14px;background:#fffbe6;border-radius:8px;padding:6px 10px;margin:6px 0}.hw-check ul,.hw-out ul{margin:4px 0;padding-left:20px}`;
  (document.head || document.documentElement).appendChild(st);

}
